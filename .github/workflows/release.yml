name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The binary reports the version in internal/menu/version.go, so a tag
      # that disagrees with it would publish a release whose binary names
      # another version.
      - name: tag matches AppVersion
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^[[:space:]]*AppVersion[[:space:]]*=[[:space:]]*"\(.*\)"$/\1/p' internal/menu/version.go)"
          if [ "$want" != "$have" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match AppVersion ${have}" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
