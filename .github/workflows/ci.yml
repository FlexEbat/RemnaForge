name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build-and-test:
    # The module promises Go 1.22 (go.mod, README), so that version stays in
    # the matrix; "stable" is the compiler of the release and the one with
    # the current standard library fixes.
    name: Build, vet, fmt, unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      # The proxy tests run `haproxy -c` and `nginx -t` on the generated
      # configs and skip without the binaries, so CI installs them to make the
      # tests count. The runner's nginx is older than the stack's nginx 1.28,
      # so the test leaves out the "http2 on;" line it cannot know.
      - name: install haproxy and nginx
        run: sudo apt-get update && sudo apt-get install -y haproxy nginx-light

      - name: go test (unit, race detector)
        run: go test -race ./...

      # Go 1.22 has known standard library vulnerabilities by now, so the
      # scan means something only on the current compiler.
      - name: govulncheck
        if: matrix.go == 'stable'
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...


  # preflight talks to docker, apt, systemd and ufw, so it is exercised on
  # a disposable GitHub-hosted Ubuntu VM where those exist.
  preflight-integration:
    name: Integration - preflight on a real VM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Confirm docker is already usable on this runner
        run: docker info

      - name: Run preflight integration tests
        run: sudo -E env "PATH=$PATH" go test -tags=integration -v ./internal/preflight/...

      - name: Confirm install_packages left docker and certbot working
        run: |
          docker info
          certbot --version

  # oscheck's version comparison logic runs on whatever Debian/Ubuntu
  # this runner happens to be, exercising CheckOS against a real
  # /etc/os-release instead of only a synthetic one in a unit test.
  oscheck-integration:
    name: Integration - oscheck against the runner's real OS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run oscheck integration test
        run: go test -tags=integration -v ./internal/oscheck/...
